name: Keep-alive ping

on:
  schedule:
    # UTC 0:00-15:59 每 10 分钟 ≈ 北京时间 8:00-23:59（每天 16 小时 ≈ 480 实例小时/月，留足余量）
    - cron: "*/10 0-15 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          url="https://ds-free-api-oj61.onrender.com/health"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 300 "$url" || echo 000)
          echo "health -> HTTP $code"
          if [ "$code" = "200" ]; then echo "service online"; else echo "non-200 (maybe waking up)"; fi
