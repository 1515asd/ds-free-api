# =============================================================
# 容器内置默认配置（会被 entrypoint 复制到 /app/config/config.toml）
# 保持最小化：账号请在管理面板 /admin 里添加，不要写死在这里
# =============================================================

[server]
# 云平台部署必须 0.0.0.0，否则外部访问不到 22217
host = "0.0.0.0"
port = 22217

[ds_core]
# 上游目前只开放 default(快速模式)
model_types = ["default"]
# 每账号每小时请求上限（0=不限）。想提高吞吐请加账号，别抬这个值。
hourly_request_quota = 60
